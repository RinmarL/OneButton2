<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OneButton 2</title>
    <style>
        :root {
            --bg-color: #0a0e17; --metal-base: #1e293b; --metal-light: #334155;
            --warning-yellow: #f59e0b; --alert-red: #ef4444; --alert-blue: #0ea5e9;
            --core-cyan: #00f0ff; --led-cyan: #22d3ee; --led-blue: #3b82f6;
            --led-green: #10b981; --led-orange: #f97316; --led-red: #ef4444; --led-off: #0f172a;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none !important; -webkit-user-select: none !important; -webkit-touch-callout: none !important; -webkit-tap-highlight-color: transparent !important; outline: none !important; }
        body, html { width: 100%; height: 100%; background-color: var(--bg-color); color: #d4d4d8; font-family: 'Courier New', Consolas, monospace; overflow: hidden; touch-action: none; }
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px); pointer-events: none; z-index: 9999; }
        .vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.9) 120%); pointer-events: none; z-index: 9998; }
        #game-container { display: flex; flex-direction: column; width: 100%; height: 100%; padding: 20px; max-width: 600px; margin: 0 auto; position: relative; }
        #header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--metal-base); padding-bottom: 10px; margin-bottom: 30px; text-shadow: 0 0 5px rgba(255,255,255,0.5); z-index: 100; }
        .sector-info { font-size: 1.5rem; font-weight: bold; letter-spacing: 2px; }
        .status-leds { display: flex; gap: 10px; position: relative; z-index: 200;}
        .led { width: 15px; height: 15px; border-radius: 50%; background-color: var(--led-off); box-shadow: inset 0 2px 4px rgba(0,0,0,0.8); border: 2px solid #000; }
        .led.active-green { background-color: var(--led-green); box-shadow: 0 0 10px var(--led-green); }
        .led.active-orange { background-color: var(--led-orange); box-shadow: 0 0 10px var(--led-orange); }
        .led.active-red { background-color: var(--led-red); box-shadow: 0 0 10px var(--led-red); }
        #button-area { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; perspective: 1000px; }

        /* 02: BALANCE */
        #pressure-bar { width: 100%; max-width: 250px; height: 15px; background: #000; border: 1px solid var(--metal-base); position: absolute; top: -35px; display: none; }
        #pressure-safe { position: absolute; left: 60%; width: 20%; height: 100%; background: rgba(16, 185, 129, 0.3); border-left: 1px solid var(--led-green); border-right: 1px solid var(--led-green); }
        #pressure-fill { height: 100%; width: 0%; background: var(--alert-blue); transition: width 0.05s linear; }

        /* DIGITAL DISPLAY */
        #digital-display { width: 220px; height: 55px; position: relative; transform-style: preserve-3d; margin-bottom: 40px; z-index: 10; cursor: default; }
        .display-front, .display-back { position: absolute; top: 0; left: 0; width: 100%; height: 100%; font-size: 2.2rem; font-weight: bold; border-radius: 8px; display: flex; justify-content: center; align-items: center; backface-visibility: hidden; }
        .display-front { background: #111; border: 2px solid #333; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); color: var(--alert-red); text-shadow: 0 0 15px var(--alert-red); letter-spacing: 2px; }
        .display-front.open { color: var(--led-green); text-shadow: 0 0 15px var(--led-green), 0 0 30px var(--led-green); }
        .display-back { background: #18181b; border: 2px solid #52525b; transform: rotateY(180deg); }
        .char-target { border-bottom: 2px solid transparent; }
        .char-target.socket-active { text-shadow: 0 0 15px var(--led-orange); color: var(--led-orange); border-bottom: 2px solid var(--led-orange); }

        /* BUTTON FRAME */
        .button-frame { width: 250px; height: 250px; border-radius: 20px; position: relative; display: flex; justify-content: center; align-items: center; transform-style: preserve-3d; }
        .frame-front { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 20px; background: repeating-linear-gradient(45deg, #000, #000 15px, var(--warning-yellow) 15px, var(--warning-yellow) 30px); box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.9); backface-visibility: hidden; display: flex; justify-content: center; align-items: center; transform: translateZ(1px); }
        .frame-back { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 20px; background: #0f172a; border: 4px solid #1e293b; transform: rotateY(180deg) translateZ(1px); backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: grab; }

        /* 06, EX: WIRES (リアルインダストリアル・ワイヤー) */
        #wires-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 30; }
        .cut-wire { 
            position: absolute; 
            width: 66px; 
            height: 10px; 
            background: linear-gradient(180deg, #94a3b8 0%, #475569 35%, #1e293b 70%, #0f172a 100%);
            border: 1px solid #1e293b;
            border-radius: 4px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.7), inset 0 1px 2px rgba(255,255,255,0.4);
            pointer-events: auto; 
            cursor: crosshair; 
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .cut-wire::before, .cut-wire::after {
            content: '';
            position: absolute;
            top: 2px;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #f8fafc, #475569);
            border-radius: 50%;
            box-shadow: 0 1px 2px #000;
        }
        .cut-wire::before { left: 4px; }
        .cut-wire::after { right: 4px; }

        .cut-wire.cut { 
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            pointer-events: none;
        }
        .cut-wire.cut::before {
            top: -3px; left: 0; width: 26px; height: 8px;
            background: linear-gradient(180deg, #64748b, #1e293b);
            border-radius: 3px 0 0 3px;
            transform: rotate(-30deg);
            box-shadow: 0 2px 4px #000;
        }
        .cut-wire.cut::after {
            top: 5px; right: 0; width: 26px; height: 8px;
            background: linear-gradient(180deg, #64748b, #1e293b);
            border-radius: 0 3px 3px 0;
            transform: rotate(30deg);
            box-shadow: 0 2px 4px #000;
        }
        .w-tl { top: 6px; left: 6px; transform: rotate(45deg); }
        .w-tr { top: 6px; right: 6px; transform: rotate(-45deg); }
        .w-bl { bottom: 6px; left: 6px; transform: rotate(-45deg); }
        .w-br { bottom: 6px; right: 6px; transform: rotate(45deg); }

        /* THE BUTTON (青色) */
        #the-button { width: 200px; height: 200px; border-radius: 50%; display: flex; justify-content: center; align-items: center; position: relative; transform-style: preserve-3d; transform: translateZ(15px); transition: transform 0.1s; cursor: pointer; z-index: 20; }
        .btn-face-front { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #3b82f6, #1d4ed8 60%, #1e3a8a); border: 8px solid var(--metal-base); box-shadow: inset 0px 5px 10px rgba(255,255,255,0.4), inset 0px -10px 20px rgba(0,0,0,0.8), 0 10px 15px rgba(0,0,0,0.7), 0 0 20px rgba(2, 132, 199, 0.4); display: flex; flex-direction: column; justify-content: center; align-items: center; transform: translateZ(10px); transition: transform 0.1s, box-shadow 0.1s, background 0.2s; backface-visibility: hidden; }
        .btn-sub-num { font-size: 1.8rem; font-weight: bold; color: rgba(0,0,0,0.5); text-shadow: 1px 1px 1px rgba(255,255,255,0.2); margin-bottom: -6px; pointer-events: none; display: none; letter-spacing: 2px; }
        .btn-text { font-size: 2rem; font-weight: bold; color: rgba(0,0,0,0.5); text-shadow: 1px 1px 1px rgba(255,255,255,0.2); pointer-events: none; }
        #the-button.pressed .btn-face-front { transform: translateY(6px) scale(0.98) translateZ(10px); box-shadow: inset 0px 5px 15px rgba(0,0,0,0.8), 0 3px 5px rgba(0,0,0,0.8); }
        #the-button.disabled .btn-face-front { background: radial-gradient(circle at 30% 30%, #475569, #1e293b 60%, #0f172a); border-color: #0f172a; box-shadow: inset 0px 5px 10px rgba(255,255,255,0.1), inset 0px -10px 20px rgba(0,0,0,0.8); filter: grayscale(1); }

        /* 08: REBOOT BARRIER & REBOOT BUTTON */
        #barrier { 
            position: absolute; 
            top: -12px; 
            left: -12px; 
            width: calc(100% + 24px); 
            height: calc(100% + 24px); 
            border-radius: 50%; 
            background: radial-gradient(circle, rgba(0, 240, 255, 0.15) 0%, rgba(0, 240, 255, 0.05) 70%, rgba(0, 240, 255, 0.3) 100%); 
            border: 2px solid var(--core-cyan); 
            box-shadow: 0 0 25px var(--core-cyan), inset 0 0 25px var(--core-cyan); 
            z-index: 25; 
            pointer-events: auto; 
            display: none; 
            transition: opacity 0.15s ease, transform 0.1s ease;
        }
        #barrier.impact {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.5) 0%, rgba(0, 240, 255, 0.4) 60%, rgba(0, 240, 255, 0.8) 100%);
            box-shadow: 0 0 40px #fff, inset 0 0 30px #fff;
            transform: scale(1.03);
        }
        #reboot-btn { 
            position: absolute; 
            bottom: 12px; 
            right: 12px; 
            display: none; 
            align-items: center; 
            gap: 8px; 
            padding: 10px 16px; 
            background: linear-gradient(180deg, #2a0808 0%, #150303 100%); 
            border: 2px solid #ef4444; 
            border-radius: 8px; 
            color: #fca5a5; 
            font-size: 0.9rem; 
            font-weight: bold; 
            letter-spacing: 2px; 
            font-family: inherit; 
            cursor: pointer; 
            user-select: none; 
            touch-action: none; 
            z-index: 50; 
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4), inset 0 1px 2px rgba(255,255,255,0.2), 0 4px 10px rgba(0,0,0,0.8); 
            transition: all 0.15s ease; 
        }
        #reboot-btn:hover { 
            background: linear-gradient(180deg, #450a0a 0%, #2a0808 100%); 
            color: #fff; 
            box-shadow: 0 0 22px rgba(239, 68, 68, 0.7), inset 0 1px 3px rgba(255,255,255,0.4); 
        }
        #reboot-btn:active { 
            transform: translateY(2px) scale(0.97); 
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.8), inset 0 2px 4px rgba(0,0,0,0.8); 
        }
        #reboot-btn .reboot-icon { 
            width: 18px; 
            height: 18px; 
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
        }
        #reboot-btn:active .reboot-icon { 
            transform: rotate(-180deg); 
        }

        /* 10: CANVAS & SOCKET */
        #wire-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 150; }
        #center-socket { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); width: 20px; height: 20px; border-radius: 50%; background: #222; border: 2px solid #555; display: none; }

        /* EX: HUD, DIP, FUKIDASHI */
        #skill-hud { position: absolute; top: -80px; left: 50%; transform: translateX(-50%); width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); display: none; pointer-events: none; }
        .skill-safe-zone { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(from 210deg, rgba(255,255,255,0.8) 0deg, rgba(255,255,255,0.8) 30deg, transparent 30deg); }
        #skill-needle { position: absolute; top: 50%; left: 50%; width: 2px; height: 50%; background: #ef4444; transform-origin: top center; transform: rotate(180deg); }
        #fukidashi { position: absolute; top: 40px; right: 10px; background: #fff; color: #000; padding: 8px 12px; border-radius: 10px; font-weight: bold; cursor: pointer; user-select: none; z-index: 300; display: none; border: 2px solid #ccc; }
        #fukidashi.cracked { color: #ef4444; border-color: #ef4444; transform: scale(0.9); }
        #dip-switches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px; background: #000; border: 2px solid #333; border-radius: 5px; }
        .dip { width: 30px; height: 50px; background: #222; border: 1px solid #111; position: relative; cursor: pointer; }
        .dip-knob { position: absolute; left: 0; width: 100%; height: 50%; background: #fff; transition: top 0.1s; }
        .dip[data-state="0"] .dip-knob { top: 50%; } .dip[data-state="1"] .dip-knob { top: 0; }
        /* 06: VERTICAL SLIDE SWITCH (上下スライドスイッチ) */
        #back-switch {
            width: 58px;
            height: 96px;
            background: #090d16;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 4px;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.9), 0 4px 10px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            touch-action: none;
            position: relative;
            margin-bottom: 10px;
        }
        .v-switch-track {
            width: 100%;
            height: 100%;
            position: relative;
            background: #030712;
            border-radius: 8px;
            border: 1px solid #1e293b;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.95);
        }
        .v-switch-knob {
            position: absolute;
            left: 3px;
            width: calc(100% - 6px);
            height: 40px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 1px;
            transition: top 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s, box-shadow 0.2s, color 0.2s, border-color 0.2s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.3);
            pointer-events: none;
        }
        /* OFF: 下部に配置 */
        #back-switch.switch-off .v-switch-knob {
            top: calc(100% - 43px);
            background: linear-gradient(180deg, #475569 0%, #1e293b 100%);
            border: 1px solid #475569;
            color: #94a3b8;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        /* ON: 上部に配置＆水色に発光！ */
        #back-switch.switch-on .v-switch-knob {
            top: 3px;
            background: linear-gradient(180deg, #00f0ff 0%, #0284c7 100%);
            border: 1px solid #38bdf8;
            color: #031326;
            text-shadow: 0 0 4px rgba(255,255,255,0.6);
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.8), inset 0 1px 2px rgba(255,255,255,0.9);
        }

        /* 05: CHIPS */
        #chip-container { position: absolute; bottom: 15px; left: 0; width: 100%; display: flex; justify-content: center; gap: 10px; z-index: 50; display: none; }
        .chip { width: 45px; height: 45px; background: #1e293b; border: 2px solid var(--core-cyan); border-radius: 8px; color: var(--core-cyan); display: flex; justify-content: center; align-items: center; font-size: 1.5rem; font-weight: bold; cursor: grab; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }

        /* LOG AREA */
        #log-wrapper {
            height: 100px;
            background-color: rgba(0,0,0,0.8);
            border: 1px solid var(--metal-base);
            padding: 10px;
            overflow-y: auto;
            overflow-x: hidden;
            font-size: 0.9rem;
            color: var(--led-green);
            text-shadow: 0 0 3px var(--led-green);
            position: relative;
            z-index: 5;
        }
        #log-area {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 100%;
        }
        .log-entry { margin: 2px 0; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        .log-num-drag {
            display: inline-block;
            padding: 1px 7px;
            margin: 0 3px;
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid var(--core-cyan);
            border-radius: 4px;
            color: var(--core-cyan);
            font-weight: bold;
            cursor: grab;
            user-select: none;
            touch-action: none;
            box-shadow: 0 0 5px rgba(0, 240, 255, 0.3);
            transition: transform 0.1s ease, background 0.1s ease;
        }
        .log-num-drag:hover {
            background: var(--core-cyan);
            color: #000;
            box-shadow: 0 0 10px var(--core-cyan);
            transform: scale(1.15);
        }
        .log-num-drag.used {
            opacity: 0.3;
            pointer-events: none;
            border-color: #555;
            color: #777;
            background: transparent;
            box-shadow: none;
        }

        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
        .shake { animation: shake 0.5s; }

        #transition-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9000; opacity: 1; pointer-events: none; transition: opacity 0.8s ease; }
        #sector-intro { position: fixed; top: -100px; left: 0; width: 100%; text-align: center; font-size: 2rem; font-weight: bold; color: #fff; text-shadow: 0 0 15px var(--core-cyan); z-index: 9500; pointer-events: none; opacity: 0; letter-spacing: 3px; }
        .intro-anim { animation: introSlide 3s ease forwards; }
        @keyframes introSlide { 0% { transform: translateY(0); opacity: 0; } 15% { transform: translateY(30vh); opacity: 1; } 75% { transform: translateY(30vh); opacity: 1; } 100% { transform: translateY(20vh); opacity: 0; } }

                #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #0a0e17 0%, #000 80%); z-index: 11000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s ease, visibility 0.5s ease; }
        .start-content { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 40px 30px; background: rgba(18, 18, 20, 0.9); border: 2px solid var(--metal-base); border-radius: 16px; box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(0, 0, 0, 0.8); position: relative; max-width: 90%; width: 360px; }
        .start-title { font-size: 3.6rem; font-weight: 700; letter-spacing: 0.5px; color: #ffffff; margin: 0 0 30px 0; text-shadow: 0 0 12px rgba(0, 240, 255, 0.8), 0 0 25px rgba(0, 240, 255, 0.4); font-family: 'Bahnschrift', 'DIN Alternate', 'Franklin Gothic Medium', 'Arial Narrow', sans-serif-condensed, sans-serif; font-stretch: condensed; display: inline-block; transform: scaleX(0.9); animation: titleGlow 2s ease-in-out infinite alternate; }
        @keyframes titleGlow { from { text-shadow: 0 0 10px rgba(0, 240, 255, 0.6), 0 0 20px rgba(0, 240, 255, 0.3); } to { text-shadow: 0 0 20px rgba(0, 240, 255, 1), 0 0 40px rgba(0, 240, 255, 0.7); } }
        .digital-btn { width: 100%; padding: 16px 20px; background: linear-gradient(180deg, #1e293b, #0f172a); color: var(--core-cyan); border: 2px solid var(--core-cyan); border-radius: 8px; font-family: inherit; font-size: 1.3rem; font-weight: bold; letter-spacing: 4px; cursor: pointer; box-shadow: 0 0 20px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.1); transition: all 0.15s ease; }
        .digital-btn:hover { background: var(--alert-blue); color: #fff; box-shadow: 0 0 20px rgba(0, 240, 255, 0.8); }
        #clear-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(16,185,129,0.2) 0%, #000 100%); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .clear-title { font-size: 3.2rem; color: var(--led-green); text-shadow: 0 0 20px var(--led-green); margin-bottom: 20px; }
        /* DEBUG PANEL */
        #debug-panel {
            position: fixed;
            bottom: 10px;
            right: 10px;
            z-index: 12000;
            background: rgba(10, 14, 23, 0.94);
            border: 1px solid var(--core-cyan);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3), inset 0 0 10px rgba(0, 0, 0, 0.8);
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.75rem;
            color: #fff;
            user-select: none;
            touch-action: auto;
            transition: transform 0.2s ease, opacity 0.2s ease;
            max-width: calc(100vw - 20px);
        }
        .debug-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            background: rgba(0, 240, 255, 0.15);
            cursor: pointer;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
        }
        .debug-title {
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--core-cyan);
            text-shadow: 0 0 5px var(--core-cyan);
        }
        .debug-toggle-btn {
            background: none;
            border: none;
            color: var(--core-cyan);
            font-size: 0.8rem;
            cursor: pointer;
            padding: 0 4px;
        }
        .debug-body {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #debug-panel.collapsed .debug-body {
            display: none;
        }
        #debug-panel.collapsed .debug-header {
            border-bottom: none;
        }
        .debug-label {
            font-size: 0.65rem;
            color: #94a3b8;
            margin-bottom: 3px;
        }
        .debug-stages {
            display: grid;
            grid-template-columns: repeat(6, 1fr);

<body>

<script>
const AudioSys = {
    ctx: null,
    init() { if (!this.ctx) { const AudioContext = window.AudioContext || window.webkitAudioContext; this.ctx = new AudioContext(); } if (this.ctx.state === 'suspended') this.ctx.resume(); },
    playOsc(type, freq, dur, vol = 0.5) {
        if(!this.ctx) return; const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        osc.connect(gain); gain.connect(this.ctx.destination); osc.start();
        gain.gain.setValueAtTime(vol, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur); osc.stop(this.ctx.currentTime + dur);
    },
    playNoise(dur, vol = 0.5, type = 'white') {
        if(!this.ctx) return; const bufferSize = this.ctx.sampleRate * dur; const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate); const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        if(type === 'steam') { filter.type = 'lowpass'; filter.frequency.value = 1000; }
        if(type === 'spark') { filter.type = 'highpass'; filter.frequency.value = 5000; }
        const gain = this.ctx.createGain(); noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
        noise.start(); gain.gain.setValueAtTime(vol, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
    },
    sfx: {
        click() { 
            AudioSys.playOsc('triangle', 2200, 0.015, 0.25); 
            AudioSys.playNoise(0.012, 0.15, 'spark'); 
        },
        thud() { AudioSys.playOsc('triangle', 100, 0.1, 0.2); },
        beep() { AudioSys.playOsc('square', 600, 0.1, 0.1); },
        buzz() { 
            AudioSys.playOsc('sawtooth', 130, 0.12, 0.1); 
            setTimeout(() => AudioSys.playOsc('sawtooth', 105, 0.22, 0.1), 120); 
        },
        success() { AudioSys.playOsc('sine', 1046.50, 0.1, 0.1); setTimeout(() => AudioSys.playOsc('sine', 1318.51, 0.15, 0.1), 100); setTimeout(() => AudioSys.playOsc('sine', 1567.98, 0.2, 0.1), 200); },
        glass() { AudioSys.playNoise(0.2, 0.3, 'spark'); AudioSys.playOsc('square', 2000, 0.1, 0.1); },
        wireCut() { AudioSys.playOsc('sine', 950, 0.03, 0.06); AudioSys.playNoise(0.03, 0.05, 'spark'); },
        dullClick() { AudioSys.playOsc('triangle', 90, 0.05, 0.08); },
        deflect() {
            AudioSys.playOsc('sine', 2800, 0.08, 0.25);
            setTimeout(() => AudioSys.playOsc('sine', 3500, 0.05, 0.15), 10);
            AudioSys.playNoise(0.02, 0.2, 'spark');
        }
    }
};

const UI = {
    logArea: document.getElementById('log-area'),
    btnFrame: document.getElementById('b-frame'),
    btn: document.getElementById('the-button'),
    sectorDisp: document.getElementById('sector-display'),
    leds: [document.getElementById('led-1'), document.getElementById('led-2'), document.getElementById('led-3'), document.getElementById('led-4'), document.getElementById('led-5')],
    log(msg) {
        const div = document.createElement('div');
        div.className = 'log-entry';
        div.textContent = `> ${msg}`;
        this.logArea.appendChild(div);
        const wrapper = document.getElementById('log-wrapper');
        if(wrapper) wrapper.scrollTop = wrapper.scrollHeight;
    },
    clearLog() { this.logArea.innerHTML = ''; },
    setLED(index, color) { if(this.leds[index]) this.leds[index].className = `led active-${color}`; },
    resetLEDs() { this.leds.forEach(l => { if(l) l.className = 'led active-red'; }); }
};

let currentStage = 1;
const MAX_STAGE = 11;
let stageState = {}; 
let stageTransitioning = false;
const btn = UI.btn; const frame = UI.btnFrame; const container = document.getElementById('game-container');

function getEventPos(e) { if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY }; return { x: e.clientX, y: e.clientY }; }

const handlers = {
    down: (e) => { if (e.cancelable) e.preventDefault(); AudioSys.init(); if(STAGES[currentStage].down) STAGES[currentStage].down(e); },
    up: (e) => { if (e.cancelable) e.preventDefault(); if(STAGES[currentStage].up) STAGES[currentStage].up(e); },
    move: (e) => { if (e.cancelable) e.preventDefault(); if(STAGES[currentStage].move) STAGES[currentStage].move(e); },
    winMove: (e) => { if(STAGES[currentStage].winMove) STAGES[currentStage].winMove(e); }
};

btn.addEventListener('pointerdown', handlers.down);
document.addEventListener('pointerup', handlers.up);
btn.addEventListener('pointermove', handlers.move);
document.addEventListener('pointermove', handlers.winMove);
document.addEventListener('contextmenu', (e) => e.preventDefault());

function completeStage() {
    if (stageTransitioning) return; stageTransitioning = true;
    AudioSys.sfx.success(); UI.log('ステージクリア。');
    UI.leds.forEach((_, idx) => UI.setLED(idx, 'green'));
    UI.btn.style.pointerEvents = 'none';
    const disp = document.getElementById('digital-display'); const dispText = document.getElementById('display-front-text');
    if (dispText) { dispText.textContent = 'OPEN'; dispText.classList.add('open'); } if (disp) disp.classList.add('open');
    setTimeout(() => {
        document.getElementById('transition-overlay').style.opacity = '1';
        setTimeout(() => {
            if (currentStage >= MAX_STAGE) {
                document.getElementById('clear-screen').style.display = 'flex';
                document.getElementById('transition-overlay').style.opacity = '0';
                return;
            }
            if(STAGES[currentStage].cleanup) STAGES[currentStage].cleanup();
            currentStage++; loadStage(currentStage);
        }, 800);
    }, 1500);
}

function loadStage(num) {
    stageTransitioning = false; stageState = {};
    UI.clearLog();
    UI.leds.forEach(l => { if(l){ l.style.cursor='default'; l.onpointerdown=null; l.style.backgroundColor=''; l.style.boxShadow=''; } });
    const sName = num === 11 ? "FINAL" : STAGE_NAMES[num]; UI.sectorDisp.innerHTML = num === 11 ? `SECT<span id="char-o1" class="char-target">O</span>R EX FINAL` : `SECT<span id="char-o1" class="char-target">O</span>R ${num.toString().padStart(2, '0')} ${sName}`;
    UI.log(num === 11 ? `セクター EX をロード中...` : `セクター ${num} をロード中...`);
    const l4 = document.getElementById('led-4'); const l5 = document.getElementById('led-5');
    if (num === 11) { if(l4) l4.style.display='block'; if(l5) l5.style.display='block'; }
    else { if(l4) l4.style.display='none'; if(l5) l5.style.display='none'; }
    UI.resetLEDs(); UI.btn.style.pointerEvents = 'none';
    
    // UI Reset
    const disp = document.getElementById('digital-display'); const dispText = document.getElementById('display-front-text');
    if(dispText) { dispText.innerHTML = 'L<span id="char-o2" class="char-target">O</span>CKED'; dispText.classList.remove('open'); }
    if(disp) { disp.className = 'locked'; disp.style.transform = ''; disp.style.cursor = 'default'; }
    UI.btn.className = ''; UI.btn.style.transform = ''; frame.style.transform = ''; frame.style.left = ''; frame.style.top = '';
    document.getElementById('btn-text').textContent = 'PUSH';
    document.getElementById('pressure-bar').style.display = 'none';
    document.getElementById('wires-container').style.display = 'none';
    document.getElementById('back-switch').style.display = 'none';
    document.getElementById('back-switch').className = 'switch-off';
    const vKnob = document.getElementById('v-switch-knob');
    if (vKnob) vKnob.textContent = 'OFF';
    document.getElementById('dip-switches').style.display = 'none';
    document.getElementById('skill-hud').style.display = 'none';
    document.getElementById('center-socket').style.display = 'none';
    document.getElementById('wire-canvas').style.display = 'none';
    document.getElementById('reboot-btn').style.display = 'none';
    document.getElementById('barrier').style.display = 'none';
    document.getElementById('chip-container').style.display = 'none';
    document.getElementById('fukidashi').style.display = 'none';
    const bsn = document.getElementById('btn-sub-num');
    if (bsn) bsn.style.display = 'none';

    // 暗転中にステージ初期化を即座に実行（UIの遅延反映を防止）
    if (STAGES[num] && STAGES[num].init) {
        STAGES[num].init();
    }
    
    if (num === 6) {
        UI.btn.className = 'disabled';
        document.getElementById('wires-container').style.display = 'block';
    }

    document.getElementById('transition-overlay').style.opacity = '1';
    const intro = document.getElementById('sector-intro');
    if (intro) {
        intro.textContent = num === 11 ? `SECTOR EX : FINAL` : `SECTOR ${num.toString().padStart(2, '0')} : ${STAGE_NAMES[num]}`;
        intro.classList.remove('intro-anim'); void intro.offsetWidth; intro.classList.add('intro-anim');
    }
    setTimeout(() => {
        document.getElementById('transition-overlay').style.opacity = '0';
        setTimeout(() => {
            UI.btn.style.pointerEvents = 'auto';
        }, 800);
    }, 2000);
}

const STAGE_NAMES = { 1:'CONTACT2', 2:'BALANCE', 3:'JUST', 4:'FLICKS', 5:'DRAG&DROP', 6:'SWIPE', 7:'CODE', 8:'REBOOT', 9:'HISTORY', 10:'RELATIONSHIP', 11:'FINAL' };

const STAGES = {
    // 01: CONTACT2 (Double Tap <= 250ms)
    1: {
        init() { stageState.lastTap = 0; },
        down() {
            UI.btn.classList.add('pressed'); AudioSys.sfx.click();
            const now = Date.now();
            if (now - stageState.lastTap <= 250) { completeStage(); }
            stageState.lastTap = now;
        },
        up() { UI.btn.classList.remove('pressed'); }
    },
    // 02: BALANCE (60-80% Keep 3.0s)
    2: {
        init() {
            const bar = document.getElementById('pressure-bar');
            if (bar) bar.style.display = 'none';
            stageState.val = 0; stageState.pressing = false; stageState.hold = 0; stageState.done = false;
            let lastTime = performance.now();
            const loop = (t) => {
                if (stageState.done) return;
                const dt = (t - lastTime) / 1000; lastTime = t;
                if (stageState.pressing) stageState.val += 40 * dt; else stageState.val -= 30 * dt;
                if (stageState.val > 100) stageState.val = 100; if (stageState.val < 0) stageState.val = 0;
                document.getElementById('pressure-fill').style.width = stageState.val + '%';

                const bar = document.getElementById('pressure-bar');
                if (bar) {
                    if (stageState.pressing || stageState.val > 0) {
                        bar.style.display = 'block';
                    } else {
                        bar.style.display = 'none';
                    }
                }
                
                if (stageState.val >= 60 && stageState.val <= 80) {
                    stageState.hold += dt;
                    if (stageState.hold >= 3.0) { stageState.done = true; completeStage(); }
                } else {
                    stageState.hold = 0;
                }
                if (stageState.val === 0 || stageState.val === 100) stageState.hold = 0;
                
                // LED反映
                if(stageState.hold > 1) UI.setLED(0, 'green'); else UI.setLED(0, 'red');
                if(stageState.hold > 2) UI.setLED(1, 'green'); else UI.setLED(1, 'red');
                if(stageState.hold > 2.8) UI.setLED(2, 'green'); else UI.setLED(2, 'red');

                stageState.anim = requestAnimationFrame(loop);
            };
            stageState.anim = requestAnimationFrame(loop);
        },
        down() { stageState.pressing = true; UI.btn.classList.add('pressed'); },
        up() { stageState.pressing = false; UI.btn.classList.remove('pressed'); },
        cleanup() {
            cancelAnimationFrame(stageState.anim);
            const bar = document.getElementById('pressure-bar');
            if (bar) bar.style.display = 'none';
        }
    },
    // 03: JUST (Tap exactly at 3.0s)
    3: {
        init() { 
            stageState.started = false; stageState.done = false; document.getElementById('btn-text').textContent = 'PUSH'; 
            const td = document.getElementById('timer-display');
            if(td) { td.style.opacity = '0'; td.textContent = '3.00'; td.style.color = 'var(--core-cyan)'; }
        },
        down() {
            UI.btn.classList.add('pressed'); AudioSys.sfx.click();
            const td = document.getElementById('timer-display');
            if (!stageState.started) {
                stageState.started = true; stageState.startTime = performance.now(); UI.log('タイマー作動');
                if(td) { td.style.opacity = '1'; td.textContent = '3.00'; td.style.color = 'var(--core-cyan)'; }
                const loop = (t) => {
                    if (stageState.done || !stageState.started) return;
                    const el = (t - stageState.startTime) / 1000;
                    const remain = Math.max(0, 3.00 - el);
                    if (td) {
                        if (el >= 2.0) {
                            td.style.opacity = '0';
                        } else {
                            td.textContent = remain.toFixed(2);
                        }
                    }
                    stageState.anim = requestAnimationFrame(loop);
                };
                stageState.anim = requestAnimationFrame(loop);
            } else {
                const el = (performance.now() - stageState.startTime) / 1000;
                stageState.done = true;
                if (td) { td.style.opacity = '0'; }
                if (el >= 2.8 && el <= 3.2) { 
                    completeStage(); 
                } else { 
                    AudioSys.playOsc('triangle', 220, 0.5, 0.15);
                    setTimeout(() => AudioSys.playOsc('triangle', 180, 0.6, 0.1), 100);
                    UI.log(`失敗: ${el.toFixed(2)}秒`); 
                    stageState.started = false; 
                    stageState.done = false;
                }
            }
        },
        up() { UI.btn.classList.remove('pressed'); },
        cleanup() { 
            cancelAnimationFrame(stageState.anim); 
            const td = document.getElementById('timer-display');
            if(td) { td.style.opacity = '0'; }
        }
    },
    // 04: FLICKS (双方向レールスライド＆LOCKED左右対称突き刺さり＆リワインド復帰)
    4: {
        init() { 
            stageState.segIdx = 0; 
            stageState.segDist = 0;
            stageState.dragging = false; 
            stageState.rewinding = false;
            stageState.curPos = [0, 0];
            UI.btnFrame.style.transform = '';
            UI.btnFrame.style.transition = '';
            UI.btn.style.transform = '';
        },
        down(e) {
            if (stageState.rewinding) return;
            UI.btn.classList.add('pressed');
            stageState.lastX = getEventPos(e).x; 
            stageState.lastY = getEventPos(e).y;
            stageState.dragging = true;
            stageState.segIdx = 0;
            stageState.segDist = 0;
            stageState.curPos = [0, 0];
            UI.btnFrame.style.transition = '';
        },
        up() { 
            UI.btn.classList.remove('pressed'); 
            if (!stageState.dragging || stageState.rewinding) return;
            stageState.dragging = false;

            const segs = [
                { start: [0, 0], end: [0, -60], len: 60, dir: [0, -1] },
                { start: [0, -60], end: [60, -60], len: 60, dir: [1, 0] },
                { start: [60, -60], end: [60, 60], len: 120, dir: [0, 1] },
                { start: [60, 60], end: [0, 60], len: 60, dir: [-1, 0] },
                { start: [0, 60], end: [0, -90], len: 150, dir: [0, -1] }
            ];

            // 途中で手を離した場合は、通ってきたポイントを逆順に辿って初期位置へ戻る
            stageState.rewinding = true;
            const rewindPath = [];
            rewindPath.push(stageState.curPos);
            for (let i = stageState.segIdx; i >= 0; i--) {
                rewindPath.push(segs[i].start);
            }

            const stepRewind = () => {
                if (rewindPath.length === 0) {
                    stageState.segIdx = 0;
                    stageState.segDist = 0;
                    stageState.curPos = [0, 0];
                    stageState.rewinding = false;
                    UI.btnFrame.style.transition = '';
                    UI.btnFrame.style.transform = '';
                    return;
                }
                const nextPt = rewindPath.shift();
                UI.btnFrame.style.transition = 'transform 0.08s linear';
                UI.btnFrame.style.transform = `translate(${nextPt[0]}px, ${nextPt[1]}px)`;
                setTimeout(stepRewind, 80);
            };
            stepRewind();
        },
        winMove(e) {
            if (!stageState.dragging || stageState.rewinding) return;
            const p = getEventPos(e); 
            const dx = p.x - stageState.lastX; 
            const dy = p.y - stageState.lastY;
            stageState.lastX = p.x;
            stageState.lastY = p.y;

            const segs = [
                { start: [0, 0], end: [0, -60], len: 60, dir: [0, -1] },
                { start: [0, -60], end: [60, -60], len: 60, dir: [1, 0] },
                { start: [60, -60], end: [60, 60], len: 120, dir: [0, 1] },
                { start: [60, 60], end: [0, 60], len: 60, dir: [-1, 0] },
                { start: [0, 60], end: [0, -90], len: 150, dir: [0, -1] }
            ];

            const currentSeg = segs[stageState.segIdx];
            const delta = dx * currentSeg.dir[0] + dy * currentSeg.dir[1];
            stageState.segDist += delta;

            // 前に進んで次の区間へ
            while (stageState.segIdx < segs.length && stageState.segDist > segs[stageState.segIdx].len) {
                stageState.segDist -= segs[stageState.segIdx].len;
                stageState.segIdx++;
                if (stageState.segIdx >= segs.length) {
                    stageState.dragging = false;
                    UI.btnFrame.style.transform = `translate(0px, -90px)`;
                    setTimeout(() => completeStage(), 150);
                    return;
                }
            }

            // 後ろに戻って前の区間へ
            while (stageState.segDist < 0) {
                if (stageState.segIdx > 0) {
                    stageState.segIdx--;
                    stageState.segDist += segs[stageState.segIdx].len;
                } else {
                    stageState.segDist = 0;
                    break;
                }
            }

            const actSeg = segs[stageState.segIdx];
            const t = Math.max(0, Math.min(1, stageState.segDist / actSeg.len));
            const curX = actSeg.start[0] + (actSeg.end[0] - actSeg.start[0]) * t;
            const curY = actSeg.start[1] + (actSeg.end[1] - actSeg.start[1]) * t;

            stageState.curPos = [curX, curY];
            UI.btnFrame.style.transform = `translate(${curX}px, ${curY}px)`;
        },

            UI.btnFrame.style.transform = '';
            UI.btnFrame.style.transition = '';
            UI.btn.style.transform = '';
        }

            stageState.idx = 0;

            stageState.curAngle = 0;
            stageState.lastConfirmedSnap = 0;
            stageState.dragD = false;
            frame.style.transform = 'rotate(0deg)';
            frame.style.transition = '';

            stageState.downD = (e) => {
                if (e.target.closest('#the-button')) return;
                const rect = frame.getBoundingClientRect();
                stageState.cx = rect.left + rect.width / 2;
                stageState.cy = rect.top + rect.height / 2;
                const p = getEventPos(e);
                stageState.lastAng = Math.atan2(p.y - stageState.cy, p.x - stageState.cx);
                stageState.dragD = true;
                frame.style.transition = 'none';
            };

            stageState.upD = () => {
                if (!stageState.dragD) return;
                stageState.dragD = false;
                // 手を離した時に最も近い90度へカチッとスナップ吸着
                const nearestSnap = Math.round(stageState.curAngle / 90) * 90;
                stageState.curAngle = nearestSnap;
                frame.style.transition = 'transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1)';
                frame.style.transform = `rotate(${nearestSnap}deg)`;
            };

            stageState.moveD = (e) => {
                if (!stageState.dragD) return;
                const p = getEventPos(e);
                const a = Math.atan2(p.y - stageState.cy, p.x - stageState.cx);
                let da = a - stageState.lastAng;
                while (da > Math.PI) da -= 2 * Math.PI;
                while (da < -Math.PI) da += 2 * Math.PI;
                const dDeg = da * 180 / Math.PI;
                stageState.lastAng = a;
                stageState.curAngle += dDeg;

                // 90度スナップ判定（前後10度の範囲内であればその90度に吸着）
                const nearestSnap = Math.round(stageState.curAngle / 90) * 90;
                const diff = stageState.curAngle - nearestSnap;
                let displayAngle = stageState.curAngle;

                if (Math.abs(diff) <= 10) {
                    displayAngle = nearestSnap; // ±10度以内なら90度に吸着
                    
                    // 新しい90度スナップ位置に入った瞬間の処理
                    if (nearestSnap !== stageState.lastConfirmedSnap) {
                        const delta = nearestSnap - stageState.lastConfirmedSnap;
                        stageState.lastConfirmedSnap = nearestSnap;
                        AudioSys.sfx.click(); // カチッ！

                        if (stageState.idx < stageState.seq.length) {
                            const tgt = stageState.seq[stageState.idx];
                            if (Math.sign(delta) === Math.sign(tgt)) {
                                stageState.stepAngle += delta;
                                if (Math.abs(stageState.stepAngle) >= Math.abs(tgt)) {
                                    AudioSys.sfx.thud();
                                    stageState.idx++;
                                    stageState.stepAngle = 0;
                                    if (stageState.idx === stageState.seq.length) {
                                        UI.btn.classList.remove('disabled');
                                    }
                                }
                            } else {
                                // 逆回転時はシーケンスリセット
                                stageState.idx = 0;
                                stageState.stepAngle = 0;
                            }
                        }
                    }
                }

                frame.style.transform = `rotate(${displayAngle}deg)`;
            };

            frame.addEventListener('pointerdown', stageState.downD);
            document.addEventListener('pointerup', stageState.upD);
            document.addEventListener('pointermove', stageState.moveD);
        },
        down() {
            if (stageState.idx === stageState.seq.length) {
                UI.btn.classList.add('pressed');
                AudioSys.sfx.click();
                completeStage();

            }

            UI.btn.classList.remove('pressed');
        },

            frame.removeEventListener('pointerdown', stageState.downD);
            document.removeEventListener('pointerup', stageState.upD);
            document.removeEventListener('pointermove', stageState.moveD);
            frame.style.transform = '';

        }

            document.getElementById('log-wrapper').scrollTop = document.getElementById('log-wrapper').scrollHeight;

            stageState.step = 0; // 0: 未開始, 1: 押し込み完了, 2: 右スライド完了
            stageState.isBtnDown = false;
            stageState.dragFrame = false;
            stageState.fStartX = 0;
            stageState.fStartY = 0;
            frame.style.transform = 'translate(0px, 0px)';
            frame.style.transition = '';

            // フレーム全体の上下左右4方向のみスライド処理（ボタンではなくフレーム部分をドラッグ）
            stageState.downFrame = (e) => {
                if (e.target.closest('#the-button')) return;
                const p = getEventPos(e);
                stageState.fStartX = p.x;
                stageState.fStartY = p.y;
                stageState.dragFrame = true;
                frame.style.transition = 'none';
            };

            stageState.moveFrame = (e) => {
                if (!stageState.dragFrame) return;
                const p = getEventPos(e);
                const rawX = p.x - stageState.fStartX;
                const rawY = p.y - stageState.fStartY;

                let tx = 0;
                let ty = 0;
                if (Math.abs(rawX) >= Math.abs(rawY)) {
                    // 水平スライド（左右）
                    tx = Math.max(-120, Math.min(120, rawX));
                    ty = 0;
                } else {
                    // 垂直スライド（上下）
                    tx = 0;
                    ty = Math.max(-120, Math.min(120, rawY));
                }

                frame.style.transform = `translate(${tx}px, ${ty}px)`;

                // 右へ一定以上スライドしたか判定
                if (tx >= 55) {
                    if (stageState.step === 1) {
                        stageState.step = 2;
                    }
                }
            };

            stageState.upFrame = () => {
                if (!stageState.dragFrame) return;
                stageState.dragFrame = false;
                // 手を離したらスプリングで定位置に戻る
                frame.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
                frame.style.transform = 'translate(0px, 0px)';
            };

            frame.addEventListener('pointerdown', stageState.downFrame);
            document.addEventListener('pointermove', stageState.moveFrame);
            document.addEventListener('pointerup', stageState.upFrame);
        },
        down(e) {
            stageState.isBtnDown = true;
            UI.btn.classList.add('pressed');
            AudioSys.sfx.click();

            if (stageState.step === 2) {
                // Step 3: 2秒間ホールド
                stageState.holdTimer = setTimeout(() => {
                    if (stageState.isBtnDown && stageState.step === 2) {
                        completeStage();
                    }
                }, 2000);
            }
        },
        up(e) {
            if (!stageState.isBtnDown) return;
            stageState.isBtnDown = false;
            UI.btn.classList.remove('pressed');
            clearTimeout(stageState.holdTimer);

            if (stageState.step === 0) {
                // Step 1: 押し込む（1回押して離した）
                stageState.step = 1;
            } else if (stageState.step === 2) {
                // 2秒ホールド未満で離してしまった場合、リセット
                stageState.step = 0;
            }
        },
        cleanup() {
            clearTimeout(stageState.holdTimer);
            frame.removeEventListener('pointerdown', stageState.downFrame);
            document.removeEventListener('pointermove', stageState.moveFrame);
            document.removeEventListener('pointerup', stageState.upFrame);
            frame.style.transform = '';
            frame.style.transition = '';
        }
    },
    // 10: RELATIONSHIP
    10: {
        init() {
            UI.log('電力不足。');
            UI.btn.classList.add('disabled');
            const cvs = document.getElementById('wire-canvas');
            const cont = document.getElementById('game-container');
            const socket = document.getElementById('center-socket');
            cvs.style.display = 'block';
            socket.style.display = 'block';

            // Canvas解像度をコンテナ実寸に合わせる
            cvs.width = cont.clientWidth;
            cvs.height = cont.clientHeight;
            const ctx = cvs.getContext('2d');

            const leds = [document.getElementById('led-1'), document.getElementById('led-2'), document.getElementById('led-3')];
            const socks = [socket, document.getElementById('char-o1'), document.getElementById('char-o2')];
            stageState.conns = [null, null, null];
            stageState.dragL = -1;

            // 右上ランプは最初からオレンジ色に点灯
            UI.setLED(0, 'orange');
            UI.setLED(1, 'orange');
            UI.setLED(2, 'orange');

            const draw = () => {
                const cRect = cont.getBoundingClientRect();
                ctx.clearRect(0, 0, cvs.width, cvs.height);
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#f97316';
                ctx.lineCap = 'round';

                for (let i = 0; i < 3; i++) {
                    const lRect = leds[i].getBoundingClientRect();
                    const lx = lRect.left + lRect.width / 2 - cRect.left;
                    const ly = lRect.top + lRect.height / 2 - cRect.top;

                    if (stageState.conns[i] !== null) {
                        const sRect = socks[stageState.conns[i]].getBoundingClientRect();
                        const sx = sRect.left + sRect.width / 2 - cRect.left;
                        const sy = sRect.top + sRect.height / 2 - cRect.top;
                        ctx.beginPath();
                        ctx.moveTo(lx, ly);
                        ctx.lineTo(sx, sy);
                        ctx.stroke();
                    } else if (stageState.dragL === i && stageState.mx !== undefined) {
                        const mx = stageState.mx - cRect.left;
                        const my = stageState.my - cRect.top;
                        ctx.beginPath();
                        ctx.moveTo(lx, ly);
                        ctx.lineTo(mx, my);
                        ctx.stroke();
                    }
                }
            };

            leds.forEach((l, i) => {
                l.style.cursor = 'grab';
                l.onpointerdown = (e) => {
                    e.stopPropagation();
                    stageState.dragL = i;
                    stageState.mx = e.clientX;
                    stageState.my = e.clientY;
                    AudioSys.sfx.click();
                    draw();
                };
            });

            stageState.mv = (e) => {
                if (stageState.dragL >= 0) {
                    stageState.mx = e.clientX;
                    stageState.my = e.clientY;
                    draw();
                }
            };

            stageState.up = (e) => {
                if (stageState.dragL >= 0) {
                    let hit = -1;
                    socks.forEach((s, si) => {
                        const r = s.getBoundingClientRect();
                        if (e.clientX > r.left - 20 && e.clientX < r.right + 20 && e.clientY > r.top - 20 && e.clientY < r.bottom + 20) {
                            hit = si;
                        }
                    });
                    if (hit >= 0 && !stageState.conns.includes(hit)) {
                        stageState.conns[stageState.dragL] = hit;
                        AudioSys.sfx.thud();
                        socks[hit].classList.add('socket-active');
                        if (!stageState.conns.includes(null)) {
                            UI.btn.classList.remove('disabled');
                            UI.log('全ソケット接続完了');
                        }
                    }
                    stageState.dragL = -1;
                    draw();
                }
            };

            document.addEventListener('pointermove', stageState.mv);
            document.addEventListener('pointerup', stageState.up);
            draw();
        },
        down() {
            if (!stageState.conns.includes(null)) {
                UI.btn.classList.add('pressed');
                AudioSys.sfx.click();
                completeStage();
            } else {
                AudioSys.sfx.dullClick();
            }
        },
        up() {
            UI.btn.classList.remove('pressed');
        },
        cleanup() {
            document.removeEventListener('pointermove', stageState.mv);
            document.removeEventListener('pointerup', stageState.up);
            const cvs = document.getElementById('wire-canvas');
            if (cvs) {
                const ctx = cvs.getContext('2d');
                ctx.clearRect(0, 0, cvs.width, cvs.height);
                cvs.style.display = 'none';
            }
            document.getElementById('center-socket').style.display = 'none';
            UI.leds.forEach(l => {
                l.style.cursor = '';
                l.onpointerdown = null;
            });
            document.querySelectorAll('.char-target').forEach(c => c.classList.remove('socket-active'));
        }
    },
    // 11: FINAL (EX)
    11: {
        init() {
            UI.log('[BOOT] セクターEX 緊急プロトコル・ロード完了。');
            UI.log('[SYS_MEMO]: 横断歩道は気を付けて渡ること'); UI.log('[SYS_MEMO]: 右を見て、左を見て、もう1度右を見て進むこと');
            UI.log('[SYS_MEMO]: 10110111');
            
            stageState.st = [false,false,false,false,false];
            const chk = () => { if(stageState.st.every(v=>v)) { completeStage(); } };
            
            // LED 1: Triple tap <= 1.0s
            stageState.taps = [];
            // LED 4: Wires & DIP (10110111 => on,off,on,on,off,on,on,on)
            document.getElementById('wires-container').style.display='block'; document.getElementById('dip-switches').style.display='grid';
            stageState.cuts = 0; stageState.dips = [0,0,0,0,0,0,0,0];
            stageState.isSlicingEX = false;
            stageState.strokeDistEX = 0;
            stageState.lastSlicePosEX = null;

            document.querySelectorAll('.cut-wire').forEach(w => {
                w.classList.remove('cut'); 
                w.onpointerenter = null;
                w.onpointerdown = null;
            });

            const checkWireSliceEX = (cx, cy) => {
                document.querySelectorAll('.cut-wire').forEach(w => {
                    if (!w.classList.contains('cut')) {
                        const r = w.getBoundingClientRect();
                        if (cx >= r.left - 8 && cx <= r.right + 8 && cy >= r.top - 8 && cy <= r.bottom + 8) {
                            w.classList.add('cut');
                            AudioSys.sfx.wireCut();
                            stageState.cuts++;
                        }
                    }
                });
            };

            stageState.onSliceDownEX = (e) => {
                const p = getEventPos(e);
                stageState.isSlicingEX = true;
                stageState.strokeDistEX = 0;
                stageState.lastSlicePosEX = { x: p.x, y: p.y };
            };

            stageState.onSliceMoveEX = (e) => {
                const isMouseDown = (e.pointerType === 'mouse' && e.buttons === 1);
                const isTouchMove = (e.pointerType !== 'mouse' && stageState.isSlicingEX);
                if (!isMouseDown && !isTouchMove) return;

                const p = getEventPos(e);
                if (stageState.lastSlicePosEX) {
                    const d = Math.hypot(p.x - stageState.lastSlicePosEX.x, p.y - stageState.lastSlicePosEX.y);
                    stageState.strokeDistEX += d;
                    stageState.lastSlicePosEX = { x: p.x, y: p.y };
                } else {
                    stageState.lastSlicePosEX = { x: p.x, y: p.y };
                }

                if (stageState.strokeDistEX >= 25) {
                    checkWireSliceEX(p.x, p.y);
                }
            };

            stageState.onSliceUpEX = () => {
                stageState.isSlicingEX = false;
                stageState.strokeDistEX = 0;
                stageState.lastSlicePosEX = null;
            };

            document.addEventListener('pointerdown', stageState.onSliceDownEX);
            document.addEventListener('pointermove', stageState.onSliceMoveEX);
            document.addEventListener('pointerup', stageState.onSliceUpEX);

            document.querySelectorAll('.dip').forEach((d,i) => {
                d.onpointerdown = (e) => {
                    e.stopPropagation(); if(stageState.st[3]) return;
                    const st = d.dataset.state === "0" ? "1" : "0"; d.dataset.state = st; stageState.dips[i] = parseInt(st); AudioSys.sfx.click();
                    if(stageState.cuts>=4 && stageState.dips.join('') === '10110111') { stageState.st[3]=true; UI.setLED(3, 'green'); AudioSys.sfx.thud(); chk(); }
                };
            });
            
            // LED 2: Hold 2s, HUD release 210-240 (初期状態は非表示)
            document.getElementById('skill-hud').style.display = 'none';
            
            // LED 3: Fukidashi
            const l3 = UI.leds[2]; l3.style.cursor='pointer';
            const fuki = document.getElementById('fukidashi'); stageState.fCnt = 0; stageState.fTime = 0;
            l3.onpointerdown = (e) => { e.stopPropagation(); fuki.style.display='block'; AudioSys.sfx.click(); };
            fuki.onpointerdown = (e) => {
                e.stopPropagation(); const n = Date.now();
                if(n - stageState.fTime > 1000) stageState.fCnt = 0;
                stageState.fCnt++; stageState.fTime = n; AudioSys.sfx.glass();
                if(stageState.fCnt>3) fuki.style.color='#f472b6'; if(stageState.fCnt>6) fuki.style.color='#ef4444'; if(stageState.fCnt>8) fuki.classList.add('cracked');
                if(stageState.fCnt>=10 && !stageState.st[2]) { stageState.st[2]=true; UI.setLED(2, 'green'); fuki.style.display='none'; AudioSys.sfx.buzz(); chk(); }
            };
            
            stageState.downF = (e) => { if(e.target.closest('#the-button')) return; if(stageState.cuts < 4) return; stageState.sx = getEventPos(e).x; stageState.dragF = true; };
            stageState.upF = () => { stageState.dragF = false; stageState.rot = stageState.curRot || stageState.rot || 0; };
            stageState.moveF = (e) => { if(stageState.dragF && stageState.cuts >= 4){ let ang = (stageState.rot||0) + (getEventPos(e).x - stageState.sx)*0.6; frame.style.transform = `rotateY(${ang}deg)`; stageState.curRot = ang; } };
            frame.addEventListener('pointerdown', stageState.downF); document.addEventListener('pointerup', stageState.upF); document.addEventListener('pointermove', stageState.moveF);
            
            // LED 5: LOCKED Rotate (R360, L360, R360)
            const disp = document.getElementById('digital-display');
            if (disp) disp.style.cursor = 'grab';
            stageState.dSeq = [360, -360, 360]; stageState.dIdx = 0; stageState.dAng = 0; stageState.dragD = false;
            disp.onpointerdown = (e) => { const r = disp.getBoundingClientRect(); stageState.dcx=r.left+r.width/2; stageState.dcy=r.top+r.height/2; stageState.lAng=Math.atan2(getEventPos(e).y-stageState.dcy, getEventPos(e).x-stageState.dcx); stageState.dragD=true; };
            stageState.upD = () => { stageState.dragD = false; };
            stageState.moveD = (e) => {
                if(stageState.dragD && !stageState.st[4]) {
                    const a = Math.atan2(getEventPos(e).y-stageState.dcy, getEventPos(e).x-stageState.dcx);
                    let da = a - stageState.lAng; while(da>Math.PI)da-=2*Math.PI; while(da<-Math.PI)da+=2*Math.PI;
                    stageState.dAng += da * 180 / Math.PI; stageState.lAng = a;
                    disp.style.transform = `rotate(${stageState.dAng}deg)`;
                    const tgt = stageState.dSeq[stageState.dIdx];
                    if(Math.abs(stageState.dAng) >= Math.abs(tgt) && Math.sign(stageState.dAng)===Math.sign(tgt)) {
                        stageState.dIdx++; stageState.dAng=0; AudioSys.sfx.thud();
                        if(stageState.dIdx>=3){ stageState.st[4]=true; UI.setLED(4, 'green'); chk(); }
                    }
                }
            };
            document.addEventListener('pointerup', stageState.upD); document.addEventListener('pointermove', stageState.moveD);
        },
        down() {
            UI.btn.classList.add('pressed'); AudioSys.sfx.click();
            const n = Date.now(); stageState.taps.push(n); stageState.taps = stageState.taps.filter(t => n-t <= 1000);
            if(stageState.taps.length>=3 && !stageState.st[0]) { stageState.st[0]=true; UI.setLED(0, 'green'); AudioSys.sfx.thud(); }
            
            if(!stageState.st[1]) {
                document.getElementById('skill-hud').style.display = 'block';
                stageState.hStart = performance.now(); stageState.hActive = true;
                const loop = (t) => {
                    if(!stageState.hActive || stageState.st[1]) return;
                    const el = (t - stageState.hStart) / 1000;
                    const deg = (el * 180) % 360;
                    document.getElementById('skill-needle').style.transform = `rotate(${deg}deg)`;
                    stageState.curDeg = deg;
                    stageState.hAnim = requestAnimationFrame(loop);
                };
                stageState.hAnim = requestAnimationFrame(loop);
            }
        },
        up() {
            UI.btn.classList.remove('pressed'); stageState.hActive = false; cancelAnimationFrame(stageState.hAnim);
            document.getElementById('skill-hud').style.display = 'none';
            if(!stageState.st[1] && stageState.curDeg !== undefined) {
                if(stageState.curDeg >= 210 && stageState.curDeg <= 240) { stageState.st[1]=true; UI.setLED(1, 'green'); AudioSys.sfx.thud(); }
                else { AudioSys.sfx.buzz(); }
                stageState.curDeg = undefined; document.getElementById('skill-needle').style.transform='rotate(180deg)';
            }
        },
        cleanup() {
            cancelAnimationFrame(stageState.hAnim);
            document.getElementById('skill-hud').style.display = 'none';
            document.removeEventListener('pointerup', stageState.upD);
            document.removeEventListener('pointermove', stageState.moveD);
            frame.removeEventListener('pointerdown', stageState.downF);
            document.removeEventListener('pointerup', stageState.upF);
            document.removeEventListener('pointermove', stageState.moveF);
            document.removeEventListener('pointerdown', stageState.onSliceDownEX);
            document.removeEventListener('pointermove', stageState.onSliceMoveEX);
            document.removeEventListener('pointerup', stageState.onSliceUpEX);
            const disp = document.getElementById('digital-display');
            if (disp) disp.style.cursor = 'default';
        }
    }
};

function jumpToStage(num) {
    AudioSys.init();
    if (STAGES[currentStage] && STAGES[currentStage].cleanup) {
        STAGES[currentStage].cleanup();
    }
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('clear-screen').style.display = 'none';
    document.getElementById('transition-overlay').style.opacity = '0';
    
    currentStage = Math.max(1, Math.min(MAX_STAGE, num));
    loadStage(currentStage);
}

function initDebugPanel() {
    const panel = document.getElementById('debug-panel');
    const toggleBtn = document.getElementById('debug-toggle-btn');
    const header = document.querySelector('.debug-header');
    
    const toggle = () => {
        panel.classList.toggle('collapsed');
        toggleBtn.textContent = panel.classList.contains('collapsed') ? '▼' : '▲';
    };
    header.addEventListener('click', toggle);

    document.querySelectorAll('.dbg-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const s = btn.dataset.stage;
            const action = btn.dataset.action;
            if (s) {
                jumpToStage(parseInt(s));
            } else if (action === 'clear') {
                AudioSys.init();
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('clear-screen').style.display = 'flex';
                document.getElementById('transition-overlay').style.opacity = '0';
            } else if (action === 'next') {
                jumpToStage(currentStage < MAX_STAGE ? currentStage + 1 : 1);
            } else if (action === 'prev') {
                jumpToStage(currentStage > 1 ? currentStage - 1 : MAX_STAGE);
            } else if (action === 'reload') {
                jumpToStage(currentStage);
            } else if (action === 'pass') {
                completeStage();
            }
        });
    });

    window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        const key = e.key.toUpperCase();
        if (key >= '1' && key <= '9') {
            jumpToStage(parseInt(key));
        } else if (key === '0') {
            jumpToStage(10);
        } else if (key === '-' || key === 'E') {
            jumpToStage(11);
        } else if (key === 'C') {
            completeStage();
        } else if (key === 'N') {
            jumpToStage(currentStage < MAX_STAGE ? currentStage + 1 : 1);
        } else if (key === 'P') {
            jumpToStage(currentStage > 1 ? currentStage - 1 : MAX_STAGE);
        } else if (key === 'R') {
            jumpToStage(currentStage);
        } else if (key === 'D') {
            toggle();
        }
    });
}

window.onload = () => {
    initDebugPanel();
    document.getElementById('start-btn').onclick = () => {
        AudioSys.init(); AudioSys.sfx.click();
        document.getElementById('start-screen').style.opacity = '0';
        setTimeout(() => { document.getElementById('start-screen').style.display = 'none'; loadStage(1); }, 500);
    };
    document.getElementById('retry-btn').onclick = () => { location.reload(); };
    
    if (new URLSearchParams(window.location.search).has('clear')) { document.getElementById('start-screen').style.display='none'; document.getElementById('clear-screen').style.display='flex'; }
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('stage')) {
        document.getElementById('start-screen').style.display='none';
        currentStage = parseInt(urlParams.get('stage')) || 1; loadStage(currentStage);
    }
};
</script>
